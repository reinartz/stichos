[package]
name = "gp-core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
uuid = { workspace = true }
tempfile = { workspace = true }
base64 = { workspace = true }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
rand = "0.8"
rhai = { workspace = true }
minisign-verify = { workspace = true }
# C13 — P5-13: PAdES-B-B signing (RustCrypto family, ADR-0010)
rsa = { version = "0.9", features = ["sha2", "pem"] }
p384 = { version = "0.13", features = ["ecdsa"] }
ecdsa = { version = "0.16", features = ["signing", "verifying", "pem"] }
pkcs8 = { version = "0.10", features = ["pem", "encryption"] }
x509-cert = { version = "0.2", features = ["pem", "builder"] }
pkcs7 = "0.4"
der = "0.7"
const-oid = "0.9"
zeroize = "1"
spki = { version = "0.7", features = ["pem"] }
sec1 = { version = "0.7", features = ["pem"] }
rand_core = "0.6"
lopdf = "0.45"

[dev-dependencies]
proptest = "1"
