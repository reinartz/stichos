[package]
name = "engines"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
default = ["unix"]
# MS Office COM automation engine (Windows-only; stub on non-Windows).
# COM-1 skeleton ships at M4; COM-2..6 implementation landed on the
# Windows host in Phase 6. This feature gate ensures the skeleton
# compiles on all platforms via cfg attributes.
ms-office = []
# Enable Unix-specific pipe handling (poll, dup) for LibreOffice subprocess
# stdout/stderr capture. On Windows, a simpler try_clone-based approach is used.
unix = ["dep:libc"]

[dependencies]
gp-core = { path = "../gp-core", version = "0.1.0" }
adapters-ooxml = { path = "../adapters-ooxml", version = "0.1.0" }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
anyhow = { workspace = true }
glob = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
 fastrand = { workspace = true }
  libc = { workspace = true, optional = true }
 tempfile = { workspace = true }
 thiserror = { workspace = true }
