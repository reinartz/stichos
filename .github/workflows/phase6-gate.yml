name: phase6-gate
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  # phase gates bootstrap the fixture corpus (gen build) on fresh checkouts
  PYTHONPATH: harness/generator

jobs:
  phase6-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: install harness dev deps (dev-only, never shipped — concept §6)
        run: pip install -r harness/requirements-dev.txt
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('**/Cargo.lock') }}
      - name: Install xmllint (OOXML/ODF schema gates shell out to it)
        run: sudo apt-get update && sudo apt-get install -y libxml2-utils
      - name: Run phase6 gate (CI mode)
        run: bash tools/phase6_gate.sh --ci
