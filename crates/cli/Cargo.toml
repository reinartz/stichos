[package]
name = "stichos"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
default-run = "stichos"

[lints]
workspace = true

[[bin]]
name = "stichos"
path = "src/main.rs"

[dev-dependencies]
serde_json = { workspace = true }
zip = { workspace = true }
tempfile = { workspace = true }

[dependencies]
gp-core = { path = "../gp-core", version = "0.1.0" }
adapters-ooxml = { path = "../adapters-ooxml", version = "0.1.0" }
adapters-odf = { path = "../adapters-odf", version = "0.1.0" }
adapters-pdf = { path = "../adapters-pdf", version = "0.1.0" }
engines = { path = "../engines", version = "0.1.0" }
lint = { path = "../lint", version = "0.1.0" }
mcp = { path = "../mcp", version = "0.1.0" }
clap = { version = "4", features = ["derive"] }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter", "std"] }
anyhow = { workspace = true }
thiserror = { workspace = true }
sha2 = { workspace = true }
uuid = { workspace = true }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
