# cargo-deny policy — stichos (plan §3.3 external dependency policy; SEC-02)
#
# Local check:  cargo deny check bans licenses advisories sources
# For 0.19.x config format.

[graph]
# DIS-01 cross-compile targets (plan §3.3 / D2): keep the tree free of
# C-renderer -sys crates so these all build from pure Rust.
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-unknown-linux-musl",
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-pc-windows-msvc",
]

[advisories]
db-urls = ["https://github.com/RustSec/advisory-db"]
# RustSec advisory gate (plan §3.3 "advisory gate").
ignore = [
    # Transitive dep via pdf-writer (adapters-pdf); unmaintained but no known CVE
    "RUSTSEC-2024-0436",
    # Transitive dep via rhai (P3-24 script sandbox); unmaintained, no safe upgrade
    "RUSTSEC-2026-0249",
    # zip symlink permission escalation (GHSA-4684-h2q9-2vcp). Ours: archive code
    # reads/writes ODF entries via ZipReader/ZipWriter APIs; .extract() and
    # ZipStreamReader are never used (grep 2026-10-17 crates/adapters-odf:0 calls).
    # No 2.x patched release; upgrade to 9.x tracked as packaging follow-up.
    "RUSTSEC-2026-0369",
    "RUSTSEC-2026-0367",
    "RUSTSEC-2026-0368",
]

[licenses]
# Plan §3.3 allow-list: MIT / Apache-2.0 / BSD / ISC / Unicode
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "MPL-2.0",
    "CC0-1.0",
]
confidence-threshold = 0.8

[[licenses.clarify]]
# ring-style crates ship ISC/OpenSSL-ish double-licensed blobs.
name = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0x01c0e8b7 }]

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
# SEC-02 / plan §3.3 "Banned pending gate": mupdf and other C-renderers still banned.
# pdfium* bans removed 2026-09-26 by G5 adoption (dynamic linking only, D2 intact).
deny = [
    { crate = "mupdf", reason = "C-renderer + AGPL upstream; banned pending PDF-01/OQ1 ADR (plan §3.3)" },
    { crate = "mupdf*", reason = "any MuPDF binding/-sys crate; gate is PDF-01/OQ1" },
    { crate = "lokit-dl", reason = "LOKit must be a spawned subprocess (D8), never linked; blocks D2 cross-compile" },
    { crate = "lokit*", reason = "any LibreOfficeKit binding; D8: soft dependency spawned at runtime" },
    { crate = "*officekit*", reason = "any LibreOfficeKit binding; D8: soft dependency spawned at runtime" },
    { crate = "*-libreoffice*", reason = "catch-all for direct LO C/C++ bindings; engines are subprocesses (D8)" },
    { crate = "typst", reason = "Typst engine is CLI shell-out only (ADR-0004, D3); typst crate banned to enforce engine-never-linked invariant" },
    { crate = "typst*", reason = "any typst binding is linked Rust code; engines must be spawned subprocesses (ADR-0004, D3)" },
    # SEC-02 / D25: ban -sys crypto crates (RustCrypto family only)
    { crate = "ring", reason = "D2/D25: ring banned — RustCrypto family only for crypto (ADR-0010)" },
    { crate = "openssl", reason = "D2/D25: openssl-sys banned — C dependency (ADR-0010)" },
    { crate = "*-sys", reason = "D2/D25: -sys crypto banned — C-linked crypto violates D2 (ADR-0010)" },
]
# Exception: `rhai` is an embedded pure-Rust scripting VM (not a renderer engine).
# It has no fs/net/env access by default, is D2-safe (no C deps), and is scoped
# to store/IR/patch primitives only. The "engines never linked" invariant (D3)
# applies to renderer subprocesses, not to embedded scripting engines.
skip = [
    # NOTE: rhapi is intentionally NOT banned — see exception comment above.
    # If a future reviewer wants to add it to bans for consistency, the ADR-0005
    # exception rationale must be updated first.
]
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
