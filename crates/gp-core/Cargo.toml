[package]
name = "stichos-core"
description = "Core types, IR, diagnostics, content store, revision model and response envelopes for the stichos document-fidelity toolchain"
readme = "README.md"
repository = "https://github.com/reinartz/stichos"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
uuid = { workspace = true }
tempfile = { workspace = true }
base64 = { workspace = true }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
rand = "0.8"
rhai = { workspace = true }
minisign-verify = { workspace = true }
# C13 — P5-13: PAdES-B-B signing (RustCrypto family, ADR-0010)
rsa = { version = "0.9", features = ["sha2", "pem"] }
p384 = { version = "0.13", features = ["ecdsa"] }
ecdsa = { version = "0.16", features = ["signing", "verifying", "pem"] }
pkcs8 = { version = "0.10", features = ["pem", "encryption", "alloc"] }
x509-cert = { version = "0.2", features = ["pem", "builder"] }
der = "0.7"
const-oid = "0.9"
zeroize = "1"
spki = { version = "0.7", features = ["pem"] }
sec1 = { version = "0.7", features = ["pem"] }
rand_core = "0.6"
lopdf = "0.45"
# C13 crypto: num-bigint-dig (rsa re-exports this)
num-bigint-dig = "0.8"

[features]
openssl-ci = []
pades-ltv = [
    "dep:x509-parser",
    "dep:reqwest",
    "dep:time",
    "dep:rcgen",
    "dep:pem",
    "dep:url",
]

[dependencies.x509-parser]
version = "0.15"
features = ["verify"]
optional = true

[dependencies.reqwest]
version = "0.11"
default-features = false
features = ["rustls-tls", "json"]
optional = true

[dependencies.time]
version = "0.3"
features = ["serde", "std"]
optional = true

[dependencies.rcgen]
version = "0.13"
optional = true

[dependencies.pem]
version = "3.0"
optional = true

[dependencies.url]
version = "2"
optional = true

[dev-dependencies]
 proptest = "1"
 winapi = { version = "0.3", features = ["winbase", "fileapi", "handleapi", "winnt"] }
