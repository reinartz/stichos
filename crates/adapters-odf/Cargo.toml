[package]
name = "adapters-odf"
description = "ODF (odt/ods/odp) read/write adapters for the stichos document-fidelity toolchain"
readme = "../README.md"
include = ["src/**/*", "Cargo.toml", "../README.md"]
repository = "https://github.com/reinartz/stichos"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
gp-core = { package = "stichos-core", path = "../gp-core", version = "0.2.0" }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tracing = { workspace = true }
zip = { workspace = true }
