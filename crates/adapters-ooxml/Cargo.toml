[package]
name = "adapters-ooxml"
description = "OOXML (docx/xlsx/pptx) OPC packaging, XML parsing and read/write adapters for the stichos toolchain"
readme = "../../README.md"
repository = "https://github.com/reinartz/stichos"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
gp-core = { package = "stichos-core", path = "../gp-core", version = "0.2.0" }
hex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tracing = { workspace = true }
zip = { workspace = true }
lint = { package = "stichos-lint", path = "../lint", version = "0.2.0" }

[dev-dependencies]
tempfile = { workspace = true }
proptest = "1"
uuid = { workspace = true }
