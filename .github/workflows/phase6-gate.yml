name: phase6-gate
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  phase6-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
      - name: Cache cargo
        uses: actions/cache@v7
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('**/Cargo.lock') }}
      - name: Run phase6 gate (CI mode)
        run: bash tools/phase6_gate.sh --ci
