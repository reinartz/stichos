name: Phase 3 Gate
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  # phase gates bootstrap the fixture corpus (gen build) on fresh checkouts
  PYTHONPATH: harness/generator

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: install harness dev deps (dev-only, never shipped — concept §6)
        run: pip install -r harness/requirements-dev.txt
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98
      - name: Install xmllint (OOXML/ODF schema gates shell out to it)
        run: sudo apt-get update && sudo apt-get install -y libxml2-utils
      - name: Run phase3 gate
        run: bash tools/phase3_gate.sh --ci
