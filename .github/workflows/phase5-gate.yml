name: phase5-gate
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  # phase gates bootstrap the fixture corpus (gen build) on fresh checkouts
  PYTHONPATH: harness/generator

jobs:
  phase5-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: install harness dev deps (dev-only, never shipped — concept §6)
        run: pip install -r harness/requirements-dev.txt
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Install xmllint (OOXML/ODF schema gates shell out to it)
        run: sudo apt-get update && sudo apt-get install -y libxml2-utils
      - name: "Gate 0: intake hygiene"
        run: bash tools/p5_01_verify.sh
      - name: "Gate 0: fixture corpus"
        run: bash tools/p5_02_verify.sh
      - name: "Gate P: PDF annotation round-trip"
        run: bash tools/phase5_gate.sh --ci
      - name: "Gate X: full gate"
        run: bash tools/phase5_gate.sh --ci
      - name: Workspace tests
        run: cargo test --workspace --lib
      - name: Clippy
        run: cargo clippy --workspace --lib -- -D warnings
      - name: Format check
        run: cargo fmt --all --check
