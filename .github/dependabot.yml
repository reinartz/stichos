# stichos dependency automation (SEC-02 flavor: keep the dev-only harness
# deps + CI actions fresh; no Rust ecosystem to watch until CORE-01 lands —
# add a `cargo` entry here together with the Cargo workspace).
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/harness"           # harness/requirements-dev.txt (dev-only, never shipped)
    schedule:
      interval: "weekly"
      day: "monday"
      time: "02:30"
      timezone: "UTC"
    open-pull-requests-limit: 5
    ignore:
      # pillow + numpy are FIXTURE-CRITICAL pins (PNG rasterizer pixels / scanned-ocr noise
      # seed) — bumping them can shift corpus sha256. Treat like an engine pin (HAR-08):
      # bump deliberately -> gen build -> gen verify -> python:3.12-slim cross-check ->
      # re-render goldens. Dependabot PRs for these are closed by policy.
      - dependency-name: "pillow"
      - dependency-name: "numpy"
    commit-message:
      prefix: "chore(harness)"
    labels: ["dependencies", "harness"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "02:30"
      timezone: "UTC"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(ci)"
    labels: ["dependencies", "ci"]
