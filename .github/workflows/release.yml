name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 0.2.0)'
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always
  # aarch64 cross-linking: recent rustc defaults to bundled rust-lld with
  # --fix-cortex-a53-843419, which fails outside a real aarch64 toolchain.
  CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
            arch: x86_64
            archive: tar.gz
            artifact_name: stichos-x86_64-unknown-linux-gnu
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04
            arch: aarch64
            archive: tar.gz
            artifact_name: stichos-aarch64-unknown-linux-gnu
          - target: x86_64-unknown-linux-musl
            os: ubuntu-22.04
            arch: x86_64
            archive: tar.gz
            artifact_name: stichos-x86_64-unknown-linux-musl
          - target: aarch64-apple-darwin
            os: macos-14
            arch: aarch64
            archive: tar.gz
            artifact_name: stichos-aarch64-apple-darwin
          - target: x86_64-apple-darwin
            os: macos-14
            arch: x86_64
            archive: tar.gz
            artifact_name: stichos-x86_64-apple-darwin
          - target: x86_64-pc-windows-msvc
            os: windows-2025
            arch: x86_64
            archive: zip
            artifact_name: stichos-x86_64-pc-windows-msvc

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Determine version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF#refs/tags/v}"
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "version: ${VERSION}"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98
          targets: ${{ matrix.target }}

      - name: Install cross-compilation dependencies (Linux hosts)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # aarch64 cross-compile toolchain
          if [[ "${{ matrix.target }}" == aarch64-* ]]; then
            sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
          fi
          # musl target
          if [[ "${{ matrix.target }}" == *-linux-musl ]]; then
            sudo apt-get install -y musl-tools
          fi

      - name: Install cross-compilation dependencies (macOS hosts)
        if: runner.os == 'macOS'
        run: |
          # x86_64-apple-darwin is native on macos-13
          true

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build
        run: |
          cargo build --release --target ${{ matrix.target }} -p stichos
          echo "Built successfully for ${{ matrix.target }}"

      - name: Archive artifact (POSIX)
        if: runner.os != 'Windows'
        run: |
          BIN_NAME="stichos"
          VERSION="${{ steps.version.outputs.version }}"
          TARGET="${{ matrix.target }}"

          BIN_PATH="target/${TARGET}/release/${BIN_NAME}"
          if [ ! -f "$BIN_PATH" ]; then
            echo "ERROR: Binary not found at $BIN_PATH"
            exit 1
          fi

          # Create archive
          ARCHIVE="stichos-${VERSION}-${TARGET}.tar.gz"
          tar -czf "$ARCHIVE" -C "target/${TARGET}/release" "${BIN_NAME}"

          # Compute checksum (sha256sum -c compatible; macOS ships shasum, not sha256sum)
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$ARCHIVE" > "${ARCHIVE}.sha256"
          else
            shasum -a 256 "$ARCHIVE" > "${ARCHIVE}.sha256"
          fi

      - name: Archive artifact (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $VERSION = "${{ steps.version.outputs.version }}"
          $TARGET = "${{ matrix.target }}"

          $BIN = "target/$TARGET/release/stichos.exe"
          if (-not (Test-Path $BIN)) { Write-Error "Binary not found at $BIN"; exit 1 }

          $ARCHIVE = "stichos-$VERSION-$TARGET.zip"
          Compress-Archive -Path $BIN -DestinationPath $ARCHIVE

          # Compute checksum (sha256sum -c compatible)
          $hash = (Get-FileHash $ARCHIVE -Algorithm SHA256).Hash.ToLower()
          "$hash  $ARCHIVE" | Out-File -NoNewline -Encoding ascii "$ARCHIVE.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            stichos-*-${{ matrix.target }}.*
          retention-days: 30

  create-release:
    name: Create GitHub Release Draft
    needs: build
    runs-on: ubuntu-22.04
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Generate release body
        id: release_body
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"

          # Gather changelog entries or generate from git log
          if [ -f CHANGELOG.md ]; then
            # Extract the section for this version (stop at the next `## ` heading)
            awk -v ver="[${VERSION}]" '
              index($0, "## " ver) == 1 { print; section = 1; next }
              section && /^## / { exit }
              section { print }
            ' CHANGELOG.md > release_body.md
          fi

          # Fallback: use git log for commit messages
          if [ ! -s release_body.md ]; then
            echo "## Changes since previous release" > release_body.md
            echo "" >> release_body.md
            git log --pretty=format:'- %s' --no-merges 2>/dev/null >> release_body.md || true
          fi

      - name: Create Release Draft
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          TAG="$GITHUB_REF"

          # List artifacts
          ARTIFACTS=""
          for f in artifacts/*/stichos-*.*; do
            if [ -f "$f" ]; then
              ARTIFACTS="$ARTIFACTS  - $(basename "$f")\n"
            fi
          done

          # Create draft release (draft=true)
          gh release create "$TAG" \
            --draft \
            --title "v${VERSION}" \
            --notes-file release_body.md \
            $(for f in artifacts/*/stichos-*.*; do
              if [ -f "$f" ]; then
                echo "$f"
              fi
            done) 2>/dev/null || {
            # If release already exists, edit it
            gh release edit "$TAG" \
              --draft \
              --title "v${VERSION}" \
              --notes-file release_body.md 2>/dev/null || \
            echo "Could not create/edit release (may need personal access token for artifact upload)"
          }

  winget-manifest:
    name: Generate Winget Manifest
    needs: build
    runs-on: ubuntu-22.04
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Determine version
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Generate winget manifest
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          DATE=$(date +%Y-%m-%d)

          # Download linux-gnu artifact to compute checksum
          mkdir -p dist/winget

          # We need the actual download URLs for the release
          # For the draft, use placeholder URLs that will be updated manually
          cat > dist/winget/stichos.winget.yaml << 'WINGET_EOF'
          PackageIdentifier: stichos.stichos
          PackageVersion: VERSION_PLACEHOLDER
          ReleaseDate: DATE_PLACEHOLDER
          InstallerType: zip
          Installers:
            - Architecture: x64
              Url: https://github.com/reinartz/stichos/releases/download/vVERSION_PLACEHOLDER/stichos-x86_64-unknown-linux-gnu.tar.gz
              Sha256: SHA256_PLACEHOLDER
          ManifestType: singlePackageVersion
          WINGET_EOF

          sed -i "s/VERSION_PLACEHOLDER/$VERSION/g" dist/winget/stichos.winget.yaml
          sed -i "s|DATE_PLACEHOLDER|$DATE|g" dist/winget/stichos.winget.yaml

          echo "Generated winget manifest at dist/winget/stichos.winget.yaml"
          cat dist/winget/stichos.winget.yaml

      - name: Upload winget manifest
        uses: actions/upload-artifact@v7
        with:
          name: winget-manifest
          path: dist/winget/stichos.winget.yaml

  homebrew-formula:
    name: Generate Homebrew Formula Draft
    needs: build
    runs-on: ubuntu-22.04
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Generate Homebrew formula
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"

          mkdir -p dist/homebrew

          # Playbook §5: homebrew-core path is Formula/s/sticho.rb (class Sticho) —
          # generate under the matching filename.
          cat > dist/homebrew/sticho.rb << 'FORMULA_EOF'
          class Sticho < Formula
            desc "Local proof/render fidelity toolchain for office documents"
            homepage "https://github.com/reinartz/stichos"
            version "VERSION_PLACEHOLDER"

            on_macos do
              if Hardware::CPU.arm?
                url "https://github.com/reinartz/stichos/releases/download/vVERSION_PLACEHOLDER/stichos-aarch64-apple-darwin.tar.gz"
                sha256 "SHA256_PLACEHOLDER_MACOS_ARM"
              else
                url "https://github.com/reinartz/stichos/releases/download/vVERSION_PLACEHOLDER/stichos-x86_64-apple-darwin.tar.gz"
                sha256 "SHA256_PLACEHOLDER_MACOS_X64"
              end
            end

            on_linux do
              if Hardware::CPU.arm?
                url "https://github.com/reinartz/stichos/releases/download/vVERSION_PLACEHOLDER/stichos-aarch64-unknown-linux-gnu.tar.gz"
                sha256 "SHA256_PLACEHOLDER_LINUX_ARM"
              else
                url "https://github.com/reinartz/stichos/releases/download/vVERSION_PLACEHOLDER/stichos-x86_64-unknown-linux-gnu.tar.gz"
                sha256 "SHA256_PLACEHOLDER_LINUX_X64"
              end
            end

            def install
              bin.install "stichos"
            end
          end
          FORMULA_EOF

          sed -i "s/VERSION_PLACEHOLDER/$VERSION/g" dist/homebrew/sticho.rb

          echo "Generated Homebrew formula at dist/homebrew/sticho.rb"
          cat dist/homebrew/sticho.rb

      - name: Upload formula
        uses: actions/upload-artifact@v7
        with:
          name: homebrew-formula
          path: dist/homebrew/sticho.rb
